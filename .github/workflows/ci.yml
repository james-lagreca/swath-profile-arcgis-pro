name: tests

# The numerical core, transforms, ridgeline figure, chart JSON, sampling mask,
# the engine on an in-memory raster and the browser chart need no ArcGIS; they
# run here on every push.  The arcpy-dependent tests (raster reading, writers,
# the tool itself) run locally with the ArcGIS Pro interpreter - see README
# "Tests".
on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip numpy scipy matplotlib pytest
      - name: Run arcpy-free tests
        env:
          MPLBACKEND: Agg
        # test_webchart_render.py drives the browser chart in the runner's
        # preinstalled Google Chrome; it skips itself if no browser is found.
        run: >-
          python -m pytest -q tests/test_core.py tests/test_transforms.py
          tests/test_mask.py tests/test_chartwindow.py tests/test_webchart.py
          tests/test_webchart_render.py
      - name: Run the browser chart's JavaScript tests
        run: node --test tests/js/webchart_core.test.js
